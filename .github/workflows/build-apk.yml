name: Build MindFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            ccache \
            patch \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install "git+https://github.com/kivy/buildozer.git"

      - name: Show versions
        run: |
          python --version
          java -version
          buildozer --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List APK output
        if: always()
        run: |
          echo "Contents of bin/:"
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MindFlow-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
