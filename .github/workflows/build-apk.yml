name: Build MindFlow Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "buildozer.spec"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            autoconf automake autopoint \
            libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            ccache \
            patch \
            build-essential \
            python3-virtualenv

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools
          python -m pip install "cython==0.29.34"
          python -m pip install buildozer

      - name: Show versions
        run: |
          python --version
          java -version
          buildozer --version
          source "$HOME/.cargo/env"
          rustc --version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          source "$HOME/.cargo/env"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MindFlow-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Show APK output
        if: always()
        run: |
          find bin -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MindFlow-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
